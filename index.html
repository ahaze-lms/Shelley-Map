<!DOCTYPE html>
<html>
<head>
  <title>Shelley Radius Map Tool</title>
  <meta charset="utf-8" />
  <style>
    body { font-family: Arial; margin: 10px; }

    #map {
      height: 600px;
      margin-bottom: 15px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
    }

    input {
      width: 100%;
    }

    button {
      margin: 5px;
    }

    .toggles {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<h3>Shelley Radius Map Tool</h3>

<div id="map"></div>


<!-- TOGGLES -->
<div class="toggles">
  <!-- <label><input type="checkbox" checked onchange="toggleColumn(0)"> Show Title</label> -->
  <!-- <label><input type="checkbox" checked onchange="toggleColumn(2)"> Show Radius</label> -->
  
  <label>
    <input type="checkbox" id="toggleMapLabels" checked onchange="plot()">
    Show Labels on Map
  </label>
</div>

<table id="addressTable">
  <thead>
    <tr>
      <th>Title</th>
      <th>Address</th>
      <th>Radius (mi)</th>
      <th>Color</th>
      <th></th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<button onclick="addRow()">+ Add Row</button>
<button onclick="plot()">Plot</button>
<button onclick="window.print()">Print / Save PDF</button>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCXA06vt5XS3G9sdlzdiEH26EVcdbx2-as"></script>

<script>
let map;
let geocoder;
let objects = [];
let labels = [];

function initMap() {
  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 33.45, lng: -112.07 },
    zoom: 10
  });
  geocoder = new google.maps.Geocoder();
}

function addRow(title="", address="", radius=5, color="#3388ff") {
  const tbody = document.querySelector("#addressTable tbody");

  const row = document.createElement("tr");

  row.innerHTML = `
    <td><input value="${title}"></td>
    <td><input value="${address}"></td>
    <td><input type="number" value="${radius}"></td>
    <td><input type="color" value="${color}"></td>
    <td><button onclick="this.closest('tr').remove()">X</button></td>
  `;

  tbody.appendChild(row);
}

function clearMap() {
  objects.forEach(obj => obj.setMap(null));
  labels.forEach(label => label.setMap(null));

  objects = [];
  labels = [];
}

function plot() {
  clearMap();

  const rows = document.querySelectorAll("#addressTable tbody tr");
  const bounds = new google.maps.LatLngBounds();

  rows.forEach(row => {
    const inputs = row.querySelectorAll("input");

    const title = inputs[0].value;
    const address = inputs[1].value;
    const radius = parseFloat(inputs[2].value);
    const color = inputs[3].value;

    if (!address) return;

    geocoder.geocode({ address: address }, (results, status) => {
      if (status === "OK") {
        const loc = results[0].geometry.location;

        const marker = new google.maps.Marker({
          map,
          position: loc,
          title: title || address
        });

        const infowindow = new google.maps.InfoWindow({
          content: `<b>${title || address}</b><br>${address}`
        });

        marker.addListener("click", () => infowindow.open(map, marker));

        const circle = new google.maps.Circle({
          strokeColor: color,
          strokeOpacity: 0.8,
          strokeWeight: 2,
          fillColor: color,
          fillOpacity: 0.3,
          map,
          center: loc,
          radius: radius * 1609.34
        });

        objects.push(marker, circle);
        bounds.extend(loc);
        map.fitBounds(bounds);

        // 🔥 LABEL + SMALL DOT
        if (document.getElementById("toggleMapLabels").checked) {
         const label = new google.maps.Marker({
  position: loc,
  map: map,
  zIndex: 1000,         
  icon: {
    path: google.maps.SymbolPath.CIRCLE,
    scale: 4,
    fillColor: color,
    fillOpacity: 1,
    strokeColor: "#fff",
    strokeWeight: 1,
    labelOrigin: new google.maps.Point(0, -18)
  },
  label: {
    text: `${title || address} (${radius} mi)`,
    color: "#000",
    fontSize: "13px",
    fontWeight: "bold"
  }
          });

          labels.push(label);
        }
      }
    });
  });
}

// COLUMN TOGGLE
function toggleColumn(colIndex) {
  const table = document.getElementById("addressTable");

  for (let row of table.rows) {
    if (row.cells[colIndex]) {
      row.cells[colIndex].style.display =
        row.cells[colIndex].style.display === "none" ? "" : "none";
    }
  }
}

// Default row
addRow("Here", "Phoenix AZ");

window.onload = initMap;
</script>

</body>
</html>
